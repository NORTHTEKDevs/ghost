[workspace]
members = [
    "crates/ghost-core",
    "crates/ghost-session",
    "crates/ghost-mcp",
    "crates/ghost-cache",
    "crates/ghost-intent",
    "crates/ghost-cli",
    "crates/ghost-http",
    "crates/ghost-ground",
    "crates/ghost-platform",
]
# The crates that legitimately build on every OS. A bare `cargo build` / `cargo
# check` therefore produces a green, honest build on macOS and Linux, while the
# Windows-only crates fail with a single explanatory line if you ask for them
# explicitly. Windows developers get everything with `cargo build --workspace`
# (or the `cargo build-all` alias in .cargo/config.toml).
# See docs/plans/2026-07-cross-platform-plan.md.
default-members = [
    "crates/ghost-platform",
    "crates/ghost-ground",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_Security",
    "Win32_System_WinRT",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }
sonic-rs = "0.3"
crossbeam-channel = "0.5"
blake3 = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }
clap = { version = "4", features = ["derive"] }
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# ---------------------------------------------------------------------------
# Workspace-wide clippy allow-list.
#
# These lints all fire on pre-existing Windows-side code (ghost-core,
# ghost-cache, ghost-session/shell.rs, ghost-mcp) and were surfaced when
# newer clippy releases landed on the Windows-latest runner. They are NOT
# caused by the macOS backend work and are tracked as a follow-up cleanup
# pass; suppressing them here keeps the mac PR scoped to what it says on
# the tin. Every allow is documented below.
#
# To pick up the workspace lints table, each crate opts in with
#   [lints]
#   workspace = true
# in its own Cargo.toml.
# ---------------------------------------------------------------------------
[workspace.lints.clippy]
too_many_arguments      = "allow"  # ghost-core/uia/tree.rs UIA walker signature
should_implement_trait  = "allow"  # inherent from_str/default on internal types
manual_checked_ops      = "allow"  # ghost-core capture pixel-averaging loops
unnecessary_cast        = "allow"  # ghost-core system/clipboard.rs HGLOBAL ptr cast
type_complexity         = "allow"  # ghost-cache locator_cache closure signature
manual_div_ceil         = "allow"  # ghost-session/shell.rs chunk math
needless_borrow         = "allow"  # ghost-mcp dispatch borrows
doc_lazy_continuation   = "allow"  # ghost-mcp doc-comment list formatting
print_literal           = "allow"  # doctor_mac aligned-row prints
