version: 2
updates:
  # Workflow actions are pinned to commit SHAs; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # One grouped PR a month for compatible updates; majors arrive separately so
  # a breaking change (the windows crate, tokio) is reviewed on its own.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # ort is an exact pin on a release candidate behind the optional yolo
    # feature, which CI does not build: rc.12 and rc.15 both broke that build.
    # Move it by hand, with `cargo check -p ghost-ground --features yolo`.
    ignore:
      - dependency-name: ort
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps
