name: Linux

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# A GitHub runner has no desktop, so the live jobs synthesise one:
#   Xvfb                -> an X11 display
#   dbus-run-session    -> a session bus
#   at-spi-bus-launcher -> the accessibility bus GTK publishes to
# GTK only exposes an accessible tree when accessibility is enabled, which is
# exactly the condition docs/linux-fedora.md tells users to set.

jobs:
  test:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The Linux engine is pure Rust (atspi/zbus, x11rb, ashpd, evdev), so no
      # -devel packages are needed to BUILD. These are runtime components.
      - name: Install accessibility + display stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            at-spi2-core dbus-x11 xvfb zenity libgtk-3-0

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Unit tests
        run: cargo test --workspace

      # The new crate is held to the strictest bar. The rest of the workspace is
      # checked at the same scope the existing Windows job uses, so this PR does
      # not turn pre-existing lint debt in unrelated crates into a build failure.
      - name: Clippy (ghost-linux, strict)
        run: cargo clippy -p ghost-linux --all-targets -- -D warnings

      - name: Clippy (workspace)
        run: cargo clippy --workspace -- -D warnings

  live:
    name: Live suite (engine + MCP + CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install accessibility + display stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            at-spi2-core dbus-x11 xvfb zenity libgtk-3-0 gsettings-desktop-schemas

      - name: Build binaries and live tests
        run: |
          cargo build --bin ghost --bin ghost-mcp
          cargo test -p ghost-linux --test live_atspi --no-run
          cargo test -p ghost-mcp --test live_mcp_linux --no-run

      - name: Run live suite
        env:
          XDG_SESSION_TYPE: x11
          GTK_MODULES: gail:atk-bridge
          NO_AT_BRIDGE: "0"
          RUST_BACKTRACE: "1"
        run: |
          cat > run-live.sh <<'EOF'
          #!/usr/bin/env bash
          # Shebang matters: dbus-run-session exec's this directly, and without it
          # the kernel falls back to sh (dash), where `set -o pipefail` is illegal.
          set -euo pipefail

          gsettings set org.gnome.desktop.interface toolkit-accessibility true || true
          /usr/libexec/at-spi-bus-launcher --launch-immediately &
          sleep 3
          /usr/libexec/at-spi2-registryd &
          sleep 2
          echo "DISPLAY=$DISPLAY"

          # Poll rather than sleep: GTK startup under Xvfb varies by an order of
          # magnitude between a warm and a cold runner, and a fixed sleep makes
          # this job flaky in exactly the way a user would never see.
          wait_for_window() {
            for _ in $(seq 1 60); do
              if ./target/debug/ghost list-windows 2>/dev/null | grep -q "$1"; then
                return 0
              fi
              sleep 0.5
            done
            echo "window '$1' never appeared; list-windows says:"
            ./target/debug/ghost list-windows || true
            return 1
          }

          echo "::group::ghost doctor"
          # The first command a user runs. Exercised with an application open so
          # it takes the PASS path, not just the empty-desktop one, and its exit
          # status is enforced rather than ignored.
          zenity --forms --title=GhostDoctorProbe --text=probe --add-entry=Name &
          ZEN=$!
          wait_for_window GhostDoctorProbe
          ./target/debug/ghost doctor
          echo "::endgroup::"

          echo "::group::CLI smoke"
          ./target/debug/ghost list-windows | grep -q GhostDoctorProbe
          ./target/debug/ghost screenshot --out /tmp/ghost-ci.png
          test -s /tmp/ghost-ci.png
          kill $ZEN 2>/dev/null || true
          echo "::endgroup::"

          echo "::group::engine live suite"
          cargo test -p ghost-linux --test live_atspi -- --ignored --test-threads=1 --nocapture
          echo "::endgroup::"

          echo "::group::MCP end-to-end suite"
          cargo test -p ghost-mcp --test live_mcp_linux -- --ignored --test-threads=1 --nocapture
          echo "::endgroup::"
          EOF
          chmod +x run-live.sh
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            dbus-run-session -- ./run-live.sh

  fedora:
    name: Fedora (target distro)
    runs-on: ubuntu-latest
    container: fedora:41
    steps:
      - uses: actions/checkout@v4

      # Exactly the packages docs/linux-fedora.md tells a user to install, so
      # this job fails if those instructions are ever wrong or incomplete.
      - name: Install Fedora runtime packages
        run: |
          dnf -y install \
            at-spi2-core at-spi2-atk \
            xorg-x11-server-Xvfb dbus-x11 zenity gtk3 \
            gcc curl findutils procps-ng

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build
        run: cargo build --bin ghost --bin ghost-mcp

      - name: Unit tests
        run: cargo test -p ghost-linux

      - name: Live suite on Fedora
        env:
          XDG_SESSION_TYPE: x11
          GTK_MODULES: gail:atk-bridge
          NO_AT_BRIDGE: "0"
          RUST_BACKTRACE: "1"
        run: |
          cat > run-live.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/libexec/at-spi-bus-launcher --launch-immediately &
          sleep 3
          /usr/libexec/at-spi2-registryd &
          sleep 2
          wait_for_window() {
            for _ in $(seq 1 60); do
              if ./target/debug/ghost list-windows 2>/dev/null | grep -q "$1"; then
                return 0
              fi
              sleep 0.5
            done
            echo "window '$1' never appeared; list-windows says:"
            ./target/debug/ghost list-windows || true
            return 1
          }

          # Run doctor with an app open so it exercises the PASS path.
          zenity --forms --title=GhostDoctorProbe --text=probe --add-entry=Name &
          ZEN=$!
          wait_for_window GhostDoctorProbe
          ./target/debug/ghost doctor
          ./target/debug/ghost list-windows | grep -q GhostDoctorProbe
          kill $ZEN 2>/dev/null || true
          cargo test -p ghost-linux --test live_atspi -- --ignored --test-threads=1 --nocapture
          cargo test -p ghost-mcp --test live_mcp_linux -- --ignored --test-threads=1 --nocapture
          EOF
          chmod +x run-live.sh
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            dbus-run-session -- ./run-live.sh

  installer:
    name: Installer script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            at-spi2-core dbus-x11 xvfb shellcheck

      - name: Lint the installer
        run: shellcheck scripts/install.sh

      # The installer is what a user actually runs first. Executing it here
      # catches a bad path, a missing chmod, or CRLF line endings before they do.
      - name: Run the installer
        run: |
          test -x scripts/install.sh || { echo "install.sh is not executable in git"; exit 1; }
          xvfb-run -a dbus-run-session -- ./scripts/install.sh --no-register || true
          # doctor legitimately reports FAIL with no a11y bus here; what matters
          # is that the script ran and installed all three binaries.
          test -x "$HOME/.local/bin/ghost"
          test -x "$HOME/.local/bin/ghost-mcp"
          test -x "$HOME/.local/bin/ghost-http"
          echo "installer placed all three binaries"

  release:
    name: Release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Release build
        run: cargo build --release --bin ghost --bin ghost-http --bin ghost-mcp

      - name: Confirm binaries are Linux ELF
        run: |
          for b in ghost ghost-http ghost-mcp; do
            file "target/release/$b"
            file "target/release/$b" | grep -q "ELF 64-bit" || exit 1
          done

      - name: Smoke test the MCP server over stdio
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | timeout 30 ./target/release/ghost-mcp > mcp-out.json || true
          echo "--- server response ---"
          cat mcp-out.json
          grep -q '"ghost_see"' mcp-out.json
          grep -q '"ghost_act"' mcp-out.json
          grep -q '"ghost_shell"' mcp-out.json

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghost-linux-x86_64
          path: |
            target/release/ghost
            target/release/ghost-http
            target/release/ghost-mcp
