name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --workspace

      - name: Test (unit only, skip display-dependent integration tests)
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  # The portable subset only. These jobs must never be given `--workspace`: the
  # Windows-only crates are *expected* to fail off Windows, and a red X on an
  # expected failure trains people to ignore CI.
  # See docs/plans/2026-07-cross-platform-plan.md.
  check-macos:
    name: Check (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Check portable crates
        run: cargo check -p ghost-platform -p ghost-ground

      - name: Test platform contract
        run: cargo test -p ghost-platform

  check-linux:
    name: Check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Check portable crates
        run: cargo check -p ghost-platform -p ghost-ground

      - name: Test platform contract
        run: cargo test -p ghost-platform

  release-build:
    name: Release build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Release build
        run: cargo build --release --bin ghost --bin ghost-http --bin ghost-mcp

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghost-windows
          path: |
            target/release/ghost.exe
            target/release/ghost-http.exe
            target/release/ghost-mcp.exe
