[package]
name = "ghost-browser"
version = "0.5.0"
edition = "2021"
description = "Background browser automation for Ghost via the Chrome DevTools Protocol"
keywords = ["automation", "browser", "cdp", "chrome", "agent"]
categories = ["os::windows-apis", "asynchronous"]
license = "MIT"
repository = "https://github.com/FrostbyteDevTeam/ghost"
readme = "../../README.md"

[dependencies]
ghost-core = { path = "../ghost-core" }
tokio = { workspace = true }
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
base64 = "0.22"
windows = { workspace = true }

[[example]]
name = "browser_background_proof"
path = "../../examples/browser_background_proof.rs"

[[example]]
name = "click_probe"
path = "../../examples/click_probe.rs"

[[example]]
name = "shot_probe"
path = "../../examples/shot_probe.rs"
