[package]
name = "ghost-browser"
version = "0.5.0"
edition = "2021"
description = "Background browser automation for Ghost via the Chrome DevTools Protocol"
keywords = ["automation", "browser", "cdp", "chrome", "agent"]
categories = ["os::windows-apis", "asynchronous"]
license = "MIT"
repository = "https://github.com/FrostbyteDevTeam/ghost"
readme = "../../README.md"

[dependencies]
tokio = { workspace = true }
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }


