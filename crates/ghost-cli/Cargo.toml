[package]
name = "ghost-cli"
version.workspace = true
edition = "2021"
build = "build.rs"
description = "Command-line interface for Ghost desktop automation on Windows and Linux"
keywords = ["automation", "windows", "cli", "desktop"]
categories = ["command-line-utilities", "os::windows-apis"]
license = "MIT"
repository = "https://github.com/NORTHTEKDevs/ghost"

[[bin]]
name = "ghost"
path = "src/main.rs"

[dependencies]
ghost-session = { path = "../ghost-session" }
ghost-intent = { path = "../ghost-intent" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(windows)'.dependencies]
ghost-core = { path = "../ghost-core" }
windows = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
ghost-linux = { path = "../ghost-linux" }

[target.'cfg(target_os = "macos")'.dependencies]
ghost-macos = { path = "../ghost-macos" }

[build-dependencies]
winresource = "0.1.31"
