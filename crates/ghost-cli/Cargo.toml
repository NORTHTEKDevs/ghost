[package]
name = "ghost-cli"
version = "0.5.0"
edition = "2021"
description = "Command-line access to Ghost background automation"
keywords = ["automation", "windows", "cli", "desktop"]
categories = ["os::windows-apis", "command-line-utilities"]
license = "MIT"
repository = "https://github.com/FrostbyteDevTeam/ghost"

[[bin]]
name = "ghost"
path = "src/main.rs"

[dependencies]
ghost-mcp = { path = "../ghost-mcp" }
tokio = { workspace = true }
serde_json = { workspace = true }
