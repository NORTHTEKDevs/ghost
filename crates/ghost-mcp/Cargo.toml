[package]
name = "ghost-mcp"
version = "0.21.1"
edition = "2021"
description = "MCP server binary exposing 54 Ghost desktop, browser, and shell automation tools over stdio JSON-RPC"
keywords = ["automation", "windows", "mcp", "agent", "claude"]
categories = ["os::windows-apis", "command-line-utilities"]
license = "MIT"
repository = "https://github.com/NORTHTEKDevs/ghost"

[[bin]]
name = "ghost-mcp"
path = "src/main.rs"

[dependencies]
ghost-session = { path = "../ghost-session" }
ghost-browser = { path = "../ghost-browser" }
ghost-ground = { path = "../ghost-ground" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sonic-rs = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(windows)'.dependencies]
ghost-core = { path = "../ghost-core" }
windows = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
ghost-linux = { path = "../ghost-linux" }

[target.'cfg(target_os = "macos")'.dependencies]
ghost-macos = { path = "../ghost-macos" }
