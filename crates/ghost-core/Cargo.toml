[package]
name = "ghost-core"
version.workspace = true
edition = "2021"
description = "Low-level Win32/UIA/SendInput/DXGI primitives for the Ghost desktop automation framework"
keywords = ["automation", "windows", "win32", "desktop", "uia"]
categories = ["os::windows-apis"]
license = "MIT"
repository = "https://github.com/NORTHTEKDevs/ghost"
readme = "../../README.md"

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
image = { workspace = true }
crossbeam-channel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }

[features]
# PRIVATE TEST BUILDS ONLY - never enabled by a release. Takes the names of the
# shared emergency-stop events from GHOST_ISOLATED_STOP_NS, so a live test can
# raise a stop without stopping the human's running Ghosts. In a released
# binary it would let any agent with a shell start a Ghost that ignores the
# human's stop.
isolated-stop-events = []

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "convert"
harness = false

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
windows-core = "0.58"
