[package]
name = "ghost-core"
version = "0.3.0"
edition = "2021"
description = "Low-level Win32/UIA/SendInput/DXGI primitives for the Ghost desktop automation framework"
keywords = ["automation", "windows", "win32", "desktop", "uia"]
categories = ["os::windows-apis"]
license = "MIT"
repository = "https://github.com/NORTHTEKDevs/ghost"
readme = "../../README.md"

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
image = { workspace = true }
crossbeam-channel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }

# Ghost's engine is Windows-only today. Keeping the Win32 bindings under a target
# section lets the workspace be resolved and checked from macOS/Linux without
# pulling Win32 FFI; see docs/plans/2026-07-cross-platform-plan.md.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
windows-core = "0.58"

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "convert"
harness = false
